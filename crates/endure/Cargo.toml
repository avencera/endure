[package]
name = "endure"
description = "Durable app state that feels like in-memory data, backed by redb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["persistence", "state", "redb", "actor", "durable"]
categories = ["database", "data-structures"]

[features]
default = ["tokio"]
# offloads commits to tokio's blocking pool when an async update runs inside a runtime
tokio = ["tokio/rt"]

[dependencies]
endure-derive.workspace = true
redb = "4.4"
imbl = "7.0"
arc-swap = "1.9"
serde = "1"
rmp-serde = "1.3"
dirs = "7"
thiserror = "2"
tokio = { version = "1.53", default-features = false, features = ["sync"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3.27"
proptest = "1.12"
eyre = "0.6"
