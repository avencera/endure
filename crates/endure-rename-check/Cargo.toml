[package]
name = "endure-rename-check"
description = "Checks that the derive works when endure is renamed in Cargo.toml"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
storage = { package = "endure", path = "../endure" }
serde = { version = "1", features = ["derive"] }
